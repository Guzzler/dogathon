name: Deploy backend (Cloud Run)

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Dockerfile"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      # The key goes in via env rather than inline interpolation so a stray character
      # in the secret can't reshape the command line, and so it isn't echoed in logs.
      #
      # --max-instances=1 is a correctness pin, not a cost knob. It exists because a
      # /chat blocked waiting for approval used to hold a queue.Queue in one process's
      # memory: on a second instance the /approve landed elsewhere and the parked tool
      # call sat out its full 300s timeout with no error and no log, while the foster
      # watched a spinner.
      #
      # As of PH-8 that is no longer true. Both halves of a session now live in
      # Firestore: the transcript (session_store.py) and the approval handoff, which is
      # a polled field on the same document (approval_store.py). A decision written by
      # any instance reaches the thread parked in any other. **The pin is therefore
      # removable — but it has not been removed here on purpose.** Lifting it is its own
      # change, made after this has been watched working in production for a while, not
      # a side effect of the PR that made it safe. When it goes, raise it in one small
      # PR and watch /health's active_sessions across instances.
      # --min-instances=1 keeps that single instance warm, so a cold start doesn't land
      # in the middle of someone's first message.
      - name: Deploy to Cloud Run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          gcloud run deploy pawthway-agent \
            --source . \
            --project=pawthway-hackathon \
            --region=us-central1 \
            --allow-unauthenticated \
            --set-env-vars="ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}" \
            --min-instances=1 \
            --max-instances=1 \
            --quiet
