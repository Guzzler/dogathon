name: Deploy frontend (Firebase Hosting)

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "firebase.json"
      - ".firebaserc"
      - "firestore.rules"
      - "firestore.indexes.json"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Look up the deployed Cloud Run agent URL
        id: agent-url
        run: |
          URL=$(gcloud run services describe pawthway-agent \
            --project=pawthway-hackathon \
            --region=us-central1 \
            --format='value(status.url)')
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Write web/.env
        working-directory: web
        run: |
          cat > .env << ENVEOF
          VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_AGENT_URL=${{ steps.agent-url.outputs.url }}
          ENVEOF

      - name: Install and build
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Deploy to Firebase Hosting + Firestore rules
        run: npx firebase-tools@latest deploy --only hosting,firestore:rules --project=pawthway-hackathon --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}

      # firestore:indexes was missing from the deploy target until 2026-08-29, which
      # made firestore.indexes.json inert: the file is declared in firebase.json and
      # this workflow triggers on it (see `paths:` above), so an index committed there
      # would be reviewed, merged, and deployed by a run that silently did not deploy
      # it. Nobody noticed because no query had needed a composite index yet.
      #
      # It is a SEPARATE step, after hosting, and that ordering is deliberate. Adding
      # the target to the combined command (run 33240631397) failed the whole deploy
      # with `HTTP Error: 403, The caller does not have permission` before hosting had
      # shipped -- so a missing IAM grant took the site down with it. The deploy service
      # account has roles/datastore.user, which cannot create composite indexes; it
      # needs datastore.indexes.create (roles/datastore.indexAdmin, or owner).
      #
      # Until someone grants that, this step goes RED on every run and the run fails,
      # which is the point: the gap stays loud instead of being papered over by dropping
      # the target again. Hosting and rules are already deployed by then, so a red run
      # here means "the index didn't deploy", not "the site didn't".
      #
      # Two more things worth knowing when reading the log:
      #  - Index builds are asynchronous. `firebase deploy` returns before an index is
      #    serving, so the first query after a deploy can still fail with
      #    `failed-precondition` for a few minutes on a collection with real data.
      #    That is expected, not a bug to chase.
      #  - This never removes an index absent from the file. That is the safe
      #    direction; do not add --force or anything that changes it.
      - name: Deploy Firestore indexes
        run: npx firebase-tools@latest deploy --only firestore:indexes --project=pawthway-hackathon --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
