name: Deploy frontend (Firebase Hosting)

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "firebase.json"
      - ".firebaserc"
      - "firestore.rules"
      - "firestore.indexes.json"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Look up the deployed Cloud Run agent URL
        id: agent-url
        run: |
          URL=$(gcloud run services describe pawthway-agent \
            --project=pawthway-hackathon \
            --region=us-central1 \
            --format='value(status.url)')
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Write web/.env
        working-directory: web
        run: |
          cat > .env << ENVEOF
          VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_AGENT_URL=${{ steps.agent-url.outputs.url }}
          ENVEOF

      - name: Install and build
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Deploy to Firebase Hosting + Firestore rules
        run: npx firebase-tools@latest deploy --only hosting,firestore:rules --project=pawthway-hackathon --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
