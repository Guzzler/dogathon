name: CI

# A push to main deploys straight to Firebase Hosting and Cloud Run, so main is production.
# This is the only place a change gets looked at before it lands there.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # The design-token guard below diffs against origin/main's merge base. A
          # shallow (default depth-1) checkout has no history to find that base in,
          # which made the guard error with "no merge base" on every run since it
          # landed while still reporting success -- see docs/initiatives/
          # design-consistency.md DC-3/DC-6. The repo is small; a full fetch is cheap.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      # `npm run build` is `tsc -b && vite build`, so this is the typecheck as well.
      # No web/.env is written: the build must not need secrets, and LOCAL_MODE covers
      # a config-less clone at runtime.
      - name: Build
        working-directory: web
        run: npm run build

      - name: Test
        working-directory: web
        run: npm test

      - name: Lint
        working-directory: web
        run: npm run lint

      # Guards against PR #11's near-miss: a full palette repaint got bundled into an
      # unrelated feature PR and only didn't ship because the author caught it herself
      # in review. Diff-only (not a whole-file scan) because App.css/pawthway.css/
      # carePlan.css already carry legacy literals today -- this catches new drift
      # without demanding an immediate cleanup of old drift. theme.css and brand.ts are
      # exempt because they're where a color literal is *supposed* to live.
      - name: Fetch main for the design-token diff
        run: git fetch origin main

      - name: Design token guard
        run: |
          set -euo pipefail
          # Computed as its own statement so `set -e` sees git's exit status: the
          # previous shape piped this straight into grep with a trailing `|| true`,
          # which (with pipefail) swallowed a git failure along with the intentional
          # "grep found nothing" case, so an unreadable diff read as a clean one.
          diff=$(git diff origin/main...HEAD -- \
              ':(glob)web/src/**/*.css' ':(glob)web/src/**/*.ts' ':(glob)web/src/**/*.tsx' \
              ':(exclude)web/src/theme.css' ':(exclude)web/src/brand.ts')
          # grep exits 1 (not found) on a clean diff -- that's the one place `|| true`
          # belongs, since it's an expected outcome, not a failure.
          hits=$(echo "$diff" | grep -E '^\+' | grep -E -v '^\+\+\+' \
            | grep -E '#[0-9a-fA-F]{3,8}\b|rgba?\(' || true)
          if [ -n "$hits" ]; then
            echo "::error::New hardcoded color literal(s) outside web/src/theme.css and web/src/brand.ts."
            echo "Add the color as a token in web/src/theme.css (or brand.ts's palette) and reference it with var(--token-name) instead. See docs/initiatives/design-consistency.md."
            echo "$hits"
            exit 1
          fi

      # The other half of PR #11, and the half the guard above cannot see (DC-4). That
      # near-miss was spread over five files; the guard catches a stray literal in the
      # four non-exempt ones, but the actual repaint was the `:root` token block in
      # theme.css and `pawthwayTheme.palette` in brand.ts -- the two files the guard
      # exempts, because a color literal is *supposed* to live there. So a wholesale
      # palette rewrite still passes CI in silence.
      #
      # This reports rather than fails, deliberately: editing the palette on purpose is
      # allowed, and the goal is that a repaint be visible in review, not blocked.
      - name: Palette change notice
        run: |
          set -euo pipefail
          diff=$(git diff origin/main...HEAD -- web/src/theme.css web/src/brand.ts)
          if [ -n "$diff" ]; then
            files=$(git diff --name-only origin/main...HEAD -- web/src/theme.css web/src/brand.ts | paste -sd, - | sed 's/,/, /g')
            # Changed lines that define a custom property or name a color -- the ones a
            # reviewer has to actually look at. `|| true` because a PR may touch these
            # files without touching a token at all (a comment, a layout rule).
            tokens=$(echo "$diff" | grep -E '^[+-]' | grep -E -v '^(\+\+\+|---)' \
              | grep -E -- '--[a-zA-Z0-9-]+\s*:|#[0-9a-fA-F]{3,8}\b|rgba?\(' || true)
            echo "::warning::This PR edits the palette source ($files). The design-token guard exempts these files by design, so nothing here fails -- but a token change repaints every screen at once. Check the summary."
            {
              echo "### The palette source changed"
              echo
              echo "This PR edits \`$files\` -- where colors are *supposed* to live, and therefore"
              echo "the files the design-token guard exempts. That exemption is why PR #11's actual"
              echo "repaint would have passed CI: the guard saw the stray literals in the other four"
              echo "files, never the \`:root\` block or \`pawthwayTheme.palette\` that did the damage."
              echo
              echo "Nothing is blocked. Confirm the repaint is intended and in scope for this PR."
              if [ -n "$tokens" ]; then
                echo
                echo "Changed token and color lines:"
                echo
                echo '```diff'
                echo "$tokens"
                echo '```'
              else
                echo
                echo "_No token or color lines changed -- this edit looks like comments or layout._"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Two things get noticed here, both non-failing.
      #
      # (1) The root stylesheets resolve several live rules by source order alone, not by
      # specificity -- the `.btn` base layer in pawthway.css under theme.css's
      # `.screen .btn`, and `.chat` after App.css was deleted (DC-7). Reordering the
      # imports in App.tsx therefore repaints screens silently, which is the same shape
      # of near-miss as PR #11.
      #
      # (2) A stylesheet can also enter the app from any component, which is exactly how
      # `phases/careplan/carePlan.css` -- 1850 lines, the largest in the repo -- went a
      # month without anyone noticing it laid out against the viewport instead of the
      # frame (DC-8). This step used to diff App.tsx alone and was blind to that by
      # construction, so it now watches every .tsx under web/src.
      #
      # Neither branch fails the job. Phase-scoped stylesheets are allowed and carePlan.css
      # is staying; the point is that the next one is visible in review rather than found
      # by measurement a month later.
      - name: Stylesheet order notice
        run: |
          set -euo pipefail
          diff=$(git diff origin/main...HEAD -- web/src/App.tsx)
          moved=$(echo "$diff" | grep -E '^[+-]import "\./[A-Za-z0-9_-]+\.css";' || true)
          alldiff=$(git diff origin/main...HEAD -- ':(glob)web/src/**/*.tsx')
          # Any added/removed import of a local .css file, from any component. The
          # App.tsx lines are reported by the branch above, so drop them here.
          elsewhere=$(echo "$alldiff" | grep -E '^[+-]import ["'"'"'](\.{1,2}/)[^"'"'"']*\.css["'"'"'];?' | grep -vxF "$moved" || true)
          if [ -n "$elsewhere" ]; then
            echo "::warning::This PR adds or removes a stylesheet import outside web/src/App.tsx. A phase-scoped stylesheet is allowed, but it must share the app frame: breakpoints step at 1024/1440 with --frame-w, and widths come from --content-w. See the header comment in web/src/phases/careplan/carePlan.css."
            {
              echo "### A stylesheet import changed outside \`App.tsx\`"
              echo
              echo "A \`.css\` file is entering or leaving the app from a component rather than from"
              echo "\`App.tsx\`. That is allowed -- \`phases/careplan/carePlan.css\` is one -- but a"
              echo "phase stylesheet still shares the app's geometry: step breakpoints at **1024px**"
              echo "and **1440px** with \`--frame-w\`, cap widths with \`--content-w\`, and prefer a"
              echo "container-driven grid over a viewport breakpoint. A \`min-width:720px\` rule lays"
              echo "out against the *viewport*, which is not the frame the screen occupies."
              echo
              echo '```diff'
              echo "$elsewhere"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$moved" ]; then
            echo "::warning file=web/src/App.tsx::This PR changes the CSS import order in App.tsx. Several live rules resolve by source order, not specificity -- see the header comments in web/src/theme.css and web/src/pawthway.css."
            {
              echo "### Stylesheet import order changed"
              echo
              echo "\`web/src/App.tsx\` no longer imports its stylesheets in the same order."
              echo "\`pawthway.css\` must load **before** \`theme.css\`: it holds the \`.btn\` base"
              echo "layer that \`.screen .btn\`, \`.phone-body .btn--ghost\`, \`.sharesheet .btn\` and"
              echo "\`.shelter .btn\` are all written to override at equal or higher specificity."
              echo
              echo '```diff'
              echo "$moved"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Pinned to an exact release: astral-sh/setup-uv stopped publishing floating major
      # tags after v7, so `@v10` does not resolve.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest-known"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync dependencies
        run: uv sync --locked

      # server.py builds the tool registry at import time, so this exercises every
      # builtin tool module. Firestore and Anthropic clients are both lazy, so it
      # needs no credentials.
      - name: Import the server
        run: uv run python -c "import agent.server"

      # The CLI and the seed script are never imported above, and a syntax error in
      # either only surfaces when someone runs them.
      - name: Compile everything else
        run: uv run python -m compileall -q src scripts

      # The import and compileall steps above cover `scripts/` and the CLI, which
      # these tests don't -- they're kept, not replaced. Everything under tests/
      # runs with no ADC, no ANTHROPIC_API_KEY and no network, same as this job.
      - name: Test
        run: uv run pytest
