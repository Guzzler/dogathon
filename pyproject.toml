[project]
name = "dogathon-agent"
version = "0.1.0"
description = "A general-purpose tool-calling agent scaffold built on Claude."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "firebase-admin>=6.5",
]

[project.optional-dependencies]
arcade = ["arcadepy>=1.0"]

# Dev-only, and installed by `uv sync` (and so by CI's `uv sync --locked`)
# without needing to be named. Not a runtime dependency of the Cloud Run image.
[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
agent = "agent.cli:main"
agent-server = "agent.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.pytest.ini_options]
# The tests import `agent.*`; the package lives under src/ and is installed into
# the uv environment, so no path munging is needed -- this just keeps discovery
# pointed at one directory instead of walking web/ and node_modules.
testpaths = ["tests"]
